[package]
name = "plato-article"
version = "0.1.0"
edition = "2021"
description = "Readability extraction: raw page bytes in, one readable article out"

[features]
core-client = ["dep:plato-core"]

[dependencies]
plato-core = { path = "../core", optional = true }
dom_smoothie = "0.18.0"
# The same DOM dom_smoothie parses with, reused for the pre-extraction
# grid flattening -- no second HTML stack in the tree.
dom_query = "0.28.0"
encoding_rs = "0.8.35"
anyhow = "1.0.100"

[lib]
name = "plato_article"
path = "src/lib.rs"
