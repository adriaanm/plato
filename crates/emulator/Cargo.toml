[package]
authors = ["Bastien Dejean <nihilhill@gmail.com>"]
name = "emulator"
version = "0.9.45"
edition = "2021"

[[bin]]
name = "plato-emulator"
path = "src/main.rs"

[dependencies]
plato-core = { path = "../core" }
# The same HTTPS client the device uses, so the news reader can be developed
# here rather than over ssh.
plato-net = { path = "../net", features = ["core-client"] }
plato-article = { path = "../article", features = ["core-client"] }
sdl2 = "0.38.0"
