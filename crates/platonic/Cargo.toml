[package]
name = "platonic"
version = "0.1.0"
edition = "2021"
description = "Push a document to the reader over ssh and open it (docs/platonic.md in platokin)"

# Deliberately dependency-free: std only.  This is a single binary handed to
# other Macs, so every dependency is a thing that has to build there too --
# and the workspace has no argument parser in its lockfile, so adding one for
# ten flags would be the heaviest change in the crate.  Same reasoning as
# crates/foldersync.
#
# The two exceptions are the same exception twice: each is the OTHER END of a
# wire this tool speaks, linked so no parameter is written down in two places.
# `platonic-recv` is the device's document receiver -- std-only itself, so
# nothing new enters the tree.  `pairing` is the SPAKE2 handshake the reader
# runs in its pairing window; it brings the RustCrypto stack the device binary
# already links, and re-implementing that protocol on this side is exactly the
# drift the shared crate exists to prevent.
[dependencies]
platonic-recv = { path = "../platonic-recv" }
pairing = { path = "../pairing" }

[[bin]]
name = "platonic"
path = "src/main.rs"
